name: Deploy team hub

on:
  push:
    branches: [main]
  schedule:
    # 13:00 UTC ≈ 08:00 America/Chicago (CT)
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install PyYAML==6.0.3

      - name: Build hub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_hub.py

      # Publishes site/ to the gh-pages branch.
      # One-time setup (repo admin): Settings → Pages → Deploy from a branch
      # → Branch: gh-pages / folder: / (root)
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
