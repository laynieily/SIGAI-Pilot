document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\">\nconst REPO = \"laynieily/SIGAI-Pilot\";\nconst ACTIVITY_URL = \"https://laynieily.github.io/SIGAI-Pilot/activity.json\";\n\n// Colour blocks lifted from the reference photograph — one per person, fixed by\n// registry order so a block always means the same teammate however the grid sorts.\nconst BLOCKS = [\n  { bg: \"#EE4B2B\", ink: \"rgba(255,255,255,.9)\", dot: \"oklch(0.62 0.2 30)\" },\n  { bg: \"#EFD22B\", ink: \"rgba(60,50,0,.72)\",    dot: \"oklch(0.65 0.16 90)\" },\n  { bg: \"#E9A0A6\", ink: \"rgba(80,30,35,.66)\",   dot: \"oklch(0.62 0.14 15)\" },\n  { bg: \"#C79A4B\", ink: \"rgba(60,40,0,.7)\",     dot: \"oklch(0.6 0.12 70)\" },\n  { bg: \"#F1EFE7\", ink: \"rgba(40,45,40,.6)\",    dot: \"oklch(0.6 0.02 265)\" },\n  { bg: \"#AAC2E9\", ink: \"rgba(20,40,80,.66)\",   dot: \"oklch(0.62 0.13 255)\" },\n  { bg: \"#A8C8BE\", ink: \"rgba(20,55,45,.68)\",   dot: \"oklch(0.6 0.09 180)\" },\n  { bg: \"#6BB04A\", ink: \"rgba(255,255,255,.9)\", dot: \"oklch(0.62 0.15 145)\" }\n];\n\n// Mirrors team.yaml @ main — paints instantly, then live activity.json overrides commits.\nconst TEAM = [\n  { name: \"Laynie Avila\", github: \"laynieily\", project_repo: \"laynieily/agent-orchestration-system\", docs_path: \"MultiAgent-Orchestration-System/Laynie\", docs: [\"timeline.md\",\"issues.md\",\"prompts.md\"] },\n  { name: \"Luis Chavez\", github: \"LuisJC-creator\", project_repo: \"LuisJC-creator/LLMCostOptimizer\", docs_path: \"\", docs: [] },\n  { name: \"Sasank Panchumarthi\", github: \"sasankpanch\", project_repo: \"\", docs_path: \"\", docs: [] },\n  { name: \"Claudia Cassandra\", github: \"cloudia-cassandra\", project_repo: \"cloudia-cassandra/Orchestra\", docs_path: \"MultiAgent-Orchestration-System/Cassie\", docs: [] },\n  { name: \"Jesus Ivan Ibarra\", github: \"IvanIbarra18\", project_repo: \"IvanIbarra18/Project-15\", docs_path: \"MultiAgent-Orchestration-System/Ivan\", docs: [\"timeline.md\",\"issues.md\",\"prompts.md\"] },\n  { name: \"Bethany Tijerina\", github: \"BethanyTijerina\", project_repo: \"BethanyTijerina/LLM-Cost-Autopilot\", docs_path: \"LLM-COST-Autopilot/Bethany-Tijerina\", docs: [\"timeline.md\",\"issues.md\",\"prompts.md\"] },\n  { name: \"Francisco Izaguirre\", github: \"fizagui2\", project_repo: \"\", project_url: \"https://github.com/laynieily/SIGAI-Pilot/tree/main/Project6/Francisco\", docs_path: \"Project6/Francisco\", docs: [\"timeline.md\",\"issues.md\",\"prompts.md\"] },\n  { name: \"Viviana Ayala\", github: \"Vayala13\", project_repo: \"Vayala13/LLM-COST-Autopilot\", docs_path: \"LLM-COST-Autopilot/Viviana-Ayala\", docs: [\"timeline.md\",\"issues.md\",\"prompts.md\"], done: true, status_note: \"Phase 6 of 6 (Portfolio polish) is complete.\", status_as_of: \"Current status (as of 2026-08-02)\" }\n];\n\nconst PROJECT_LABEL = {\n  \"MultiAgent-Orchestration-System\": \"Multi-Agent Orchestration\",\n  \"LLM-COST-Autopilot\": \"LLM Cost Autopilot\",\n  \"Project6\": \"Project 6\"\n};\n\nclass Component extends DCLogic {\n  stageRef = React.createRef();\n  state = { roomy: true, detail: null, sort: null, selected: null, commits: {}, live: {}, source: \"loading\", generatedAt: \"\" };\n\n  componentDidMount() {\n    const el = this.stageRef.current;\n    if (el && typeof ResizeObserver !== \"undefined\") {\n      this.ro = new ResizeObserver(es => {\n        const w = es[0].contentRect.width;\n        const roomy = w >= 640;\n        if (roomy !== this.state.roomy) this.setState({ roomy });\n      });\n      this.ro.observe(el);\n    }\n    this.load();\n    this.onKey = e => { if (e.key === \"Escape\") this.setState({ selected: null }); };\n    window.addEventListener(\"keydown\", this.onKey);\n  }\n  componentWillUnmount() { window.removeEventListener(\"keydown\", this.onKey); }\n\n  async load() {\n    try {\n      const r = await fetch(ACTIVITY_URL, { cache: \"no-store\" });\n      if (r.ok) {\n        const j = await r.json();\n        const map = {}, live = {};\n        (j.members || []).forEach(m => {\n          map[m.github] = m.commits || [];\n          live[m.github] = {\n            docs: Array.isArray(m.docs_present) ? m.docs_present : null,\n            done: (m.status || \"\") === \"done\",\n            note: m.status_note || \"\",\n            asOf: m.status_as_of || \"\"\n          };\n        });\n        if (Object.keys(map).length) {\n          this.setState({ commits: map, live, source: \"activity\", generatedAt: j.generated_at || \"\" });\n          return;\n        }\n      }\n    } catch (e) { /* hub not deployed yet or offline — fall through */ }\n    try {\n      const repos = TEAM.filter(m => m.project_repo);\n      const results = await Promise.all(repos.map(async m => {\n        try {\n          const r = await fetch(\"https://api.github.com/repos/\" + m.project_repo + \"/commits?per_page=5\");\n          if (!r.ok) return [m.github, []];\n          const list = await r.json();\n          return [m.github, (Array.isArray(list) ? list : []).map(c => ({\n            sha: (c.sha || \"\").slice(0, 7),\n            message: ((c.commit && c.commit.message) || \"\").split(\"\\n\")[0].slice(0, 120),\n            date: (c.commit && c.commit.author && c.commit.author.date) || \"\",\n            url: c.html_url || \"\"\n          }))];\n        } catch (e) { return [m.github, []]; }\n      }));\n      const map = {};\n      results.forEach(([k, v]) => { map[k] = v; });\n      this.setState({ commits: map, source: \"api\" });\n    } catch (e) { this.setState({ source: \"offline\" }); }\n  }\n\n  ago(iso) {\n    if (!iso) return \"—\";\n    const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);\n    if (mins < 2) return \"now\";\n    if (mins < 60) return mins + \"m ago\";\n    const h = Math.floor(mins / 60);\n    if (h < 24) return h + \"h ago\";\n    const d = Math.floor(h / 24);\n    return d < 14 ? d + \"d ago\" : Math.floor(d / 7) + \"w ago\";\n  }\n\n  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }\n\n  lum(hex) {\n    const h = String(hex).replace(\"#\", \"\");\n    const c = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255)\n      .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));\n    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];\n  }\n\n  renderVals() {\n\n    const sort = this.state.sort ?? this.props.sortMode ?? \"Latest\";\n    const showThreads = this.props.showThreads ?? true;\n    const src = this.state.source;\n\n    const seg = (label, on, fn) => ({\n      label, onClick: fn,\n      weight: on ? \"600\" : \"500\",\n      bg: on ? \"rgba(255,255,255,.92)\" : \"transparent\",\n      color: on ? \"#14181a\" : \"rgba(255,255,255,.72)\"\n    });\n    const sortTabs = [\"Latest\", \"Momentum\", \"Needs docs\"].map(l => seg(l, sort === l, () => this.setState({ sort: l })));\n\n    const groups = {};\n    TEAM.forEach(m => {\n      const g = (m.docs_path || \"\").split(\"/\")[0];\n      if (g) groups[g] = (groups[g] || 0) + 1;\n    });\n\n    const now = Date.now();\n    const people = TEAM.map((m, i) => {\n      const commits = (this.state.commits[m.github] || []).slice();\n      commits.sort((a, b) => new Date(b.date) - new Date(a.date));\n      const last = commits.length ? commits[0].date : \"\";\n      const lastMs = last ? new Date(last).getTime() : 0;\n      const dayIdx = c => Math.floor((now - new Date(c.date).getTime()) / 86400000);\n      const live = this.state.live[m.github] || {};\n      const docs = live.docs || m.docs || [];\n      return { m, i, commits, last, lastMs, docs,\n        week: commits.filter(c => dayIdx(c) < 7).length,\n        prevWeek: commits.filter(c => dayIdx(c) >= 7 && dayIdx(c) < 14).length,\n        done: live.done || !!m.done, docsLive: !!live.docs,\n        note: live.note || m.status_note || \"\", asOf: live.asOf || m.status_as_of || \"\",\n        docsCount: docs.length, groupSize: groups[(m.docs_path || \"\").split(\"/\")[0]] || 0 };\n    });\n\n    const rank = p => (p.done ? 3 : 0) + (p.docsCount < 3 ? 0 : 1) + (p.m.project_repo || p.m.project_url ? 1 : 0);\n    const list = people.slice();\n    if (sort === \"Latest\") list.sort((a, b) => b.lastMs - a.lastMs);\n    if (sort === \"Momentum\") list.sort((a, b) => b.week - a.week || b.lastMs - a.lastMs);\n    if (sort === \"Needs docs\") list.sort((a, b) => rank(a) - rank(b) || a.docsCount - b.docsCount);\n\n    const loadNote = {\n      loading: \"Fetching commit activity…\",\n      offline: \"Showing the team.yaml registry — commit activity unavailable right now.\",\n      activity: \"\", api: \"\"\n    }[src] || \"\";\n    const liveNote = {\n      Latest: \"Sorted by last commit — top left is what is warm right now. Click a block for its repo, or Details for the full log.\",\n      Momentum: \"Sorted by commits in the last seven days — who has a head of steam.\",\n      \"Needs docs\": \"Sorted by what is missing — no repo or an incomplete docs folder first.\"\n    }[sort];\n\n    const build = (p, slot) => {\n      const m = p.m;\n      const block = BLOCKS[p.i % BLOCKS.length];\n      const groupKey = (m.docs_path || \"\").split(\"/\")[0];\n      const project = m.project_repo ? m.project_repo.split(\"/\")[1].replace(/[-_]/g, \" \").replace(/([a-z0-9])([A-Z])/g, \"$1 $2\")\n        : (PROJECT_LABEL[groupKey] || \"No project repo yet\");\n\n      let status, presenceColor;\n      const days = p.lastMs ? Math.floor((now - p.lastMs) / 86400000) : null;\n      if (p.done) { status = \"Complete\"; presenceColor = \"oklch(0.72 0.16 150)\"; }\n      else if (!m.project_repo && !m.project_url) { status = \"No repo listed\"; presenceColor = \"rgba(255,255,255,.5)\"; }\n      else if (days === null) { status = src === \"loading\" ? \"Checking…\" : \"No commits\"; presenceColor = \"rgba(255,255,255,.5)\"; }\n      else if (days < 1) { status = \"Committed today\"; presenceColor = \"oklch(0.78 0.16 150)\"; }\n      else if (days < 7) { status = \"Active this week\"; presenceColor = \"oklch(0.8 0.12 200)\"; }\n      else { status = \"Quiet \" + (days < 14 ? days + \"d\" : Math.floor(days / 7) + \"w\"); presenceColor = \"oklch(0.82 0.11 85)\"; }\n\n      const headline = p.note ? p.note\n        : p.done ? \"Project wrapped.\"\n        : p.commits.length ? p.commits[0].message\n        : (m.project_repo || m.project_url\n            ? (src === \"loading\" ? \"Loading recent commits…\" : \"No commit activity came back from this repo.\")\n            : \"Registered in team.yaml, no project repo pointed at yet.\");\n\n      const base = \"https://github.com/\" + REPO + \"/blob/main/\" + m.docs_path;\n      const links = [];\n      if (m.project_repo) links.push({ label: m.project_repo.split(\"/\")[1], href: \"https://github.com/\" + m.project_repo, color: \"oklch(0.5 0.14 255)\", underline: \"oklch(0.85 0.04 255)\" });\n      else if (m.project_url) links.push({ label: \"Project 6 folder\", href: m.project_url, color: \"oklch(0.5 0.14 255)\", underline: \"oklch(0.85 0.04 255)\" });\n      [\"timeline.md\", \"issues.md\", \"prompts.md\"].forEach(f => {\n        const has = p.docs.indexOf(f) >= 0;\n        links.push({\n          label: f.replace(\".md\", \"\"),\n          href: has ? base + \"/\" + f : \"https://github.com/\" + REPO + (m.docs_path ? \"/tree/main/\" + m.docs_path : \"\"),\n          color: has ? \"oklch(0.5 0.14 255)\" : \"oklch(0.72 0.01 265)\",\n          underline: has ? \"oklch(0.85 0.04 255)\" : \"transparent\"\n        });\n      });\n\n      let gap = \"\";\n      if (!m.docs_path) gap = \"no docs folder in team.yaml\";\n      else if (p.docsCount === 0) gap = \"docs folder has no standard files\";\n      else if (p.docsCount < 3) gap = (3 - p.docsCount) + \" of 3 docs missing\";\n\n      const bars = [];\n      for (let d = 13; d >= 0; d--) {\n        const n = p.commits.filter(c => Math.floor((now - new Date(c.date).getTime()) / 86400000) === d).length;\n        bars.push({\n          h: (n ? Math.min(26, 6 + n * 7) : 3) + \"px\",\n          color: n ? (d < 7 ? \"oklch(0.45 0.03 265)\" : \"oklch(0.78 0.02 265)\") : \"oklch(0.91 0.004 265)\"\n        });\n      }\n\n      const others = p.groupSize - 1;\n      const lightInk = this.lum(block.bg) < 0.179;\n      return {\n        name: m.name, handle: \"@\" + m.github,\n        color: block.bg, onColor: lightInk ? \"rgba(255,255,255,.97)\" : \"rgba(14,11,3,.94)\", presenceColor,\n        onColorSoft: lightInk ? \"rgba(255,255,255,.88)\" : \"rgba(14,11,3,.8)\",\n        onColorLine: lightInk ? \"rgba(255,255,255,.5)\" : \"rgba(14,11,3,.36)\",\n        repoUrl: m.project_repo ? \"https://github.com/\" + m.project_repo\n          : m.project_url ? m.project_url\n          : \"https://github.com/\" + REPO + (m.docs_path ? \"/tree/main/\" + m.docs_path : \"\"),\n        onInfo: e => { e.preventDefault(); this.setState({ selected: m.github }); },\n        project, status, headline, links, bars,\n        hasGap: !!gap, gap,\n        hasNote: !!p.note,\n        noteSource: (p.asOf || \"Current status\") + \" · timeline.md\",\n        ago: p.lastMs ? this.ago(p.last) : (src === \"loading\" ? \"…\" : \"—\"),\n        onClick: () => this.setState({ selected: m.github }),\n        showCommits: this.state.roomy,\n        noCommits: p.commits.length === 0,\n        emptyNote: m.project_repo || m.project_url ? \"No commits available from this repo.\" : \"Add a project repo to team.yaml to see commits here.\",\n        commits: p.commits.map(c => ({ sha: c.sha || \"—\", message: c.message, date: (c.date || \"\").slice(0, 10) })),\n        momentumLabel: p.done\n          ? \"wrapped\" + (p.lastMs ? \" · last commit \" + this.ago(p.last) : \"\")\n          : p.commits.length\n            ? p.week + \" commit\" + (p.week === 1 ? \"\" : \"s\") + \" this week\" + (p.prevWeek ? \" · \" + (p.week - p.prevWeek > 0 ? \"+\" : \"\") + (p.week - p.prevWeek) + \" vs prior\" : \"\")\n            : \"no commit data\",\n        hasThread: showThreads && others > 0,\n        thread: others + \" other\" + (others === 1 ? \"\" : \"s\") + \" documenting in \" + (PROJECT_LABEL[groupKey] || groupKey)\n      };\n    };\n\n    const cards = list.map((p, i) => build(p, i));\n    const selectedPerson = people.filter(p => p.m.github === this.state.selected)[0];\n\n    const stream = people\n      .flatMap(p => p.commits.map(c => ({ c, p })))\n      .sort((a, b) => new Date(b.c.date) - new Date(a.c.date))\n      .slice(0, 9)\n      .map(({ c, p }) => ({\n        text: c.message,\n        url: c.url || \"https://github.com/\" + p.m.project_repo,\n        meta: (p.m.project_repo || \"\").split(\"/\")[1] + \" · \" + this.ago(c.date),\n        color: BLOCKS[p.i % BLOCKS.length].bg\n      }));\n\n    const withRepo = TEAM.filter(m => m.project_repo || m.project_url).length;\n    const activeWeek = people.filter(p => p.week > 0).length;\n    const fullDocs = people.filter(p => p.docsCount === 3).length;\n    const doneCount = people.filter(p => p.done).length;\n    const pct = n => Math.round((n / TEAM.length) * 100) + \"%\";\n\n    return {\n      stop: e => { if (e && e.stopPropagation) e.stopPropagation(); },\n      onClose: () => this.setState({ selected: null }),\n      sheetOpen: !!selectedPerson,\n      sheet: selectedPerson ? build(selectedPerson) : {},\n      sortTabs, cards, stream, stageRef: this.stageRef,\n      sourceState: { loading: \"checking…\", activity: \"live\", api: \"direct\", offline: \"offline\" }[src] || src,\n      generatedLine: this.state.generatedAt ? \"generated \" + this.state.generatedAt : \"rebuilt on push to main and daily at 08:00 CT\",\n      sortNote: loadNote || liveNote,\n      sourceDot: src === \"loading\" ? \"oklch(0.82 0.11 85)\" : src === \"offline\" ? \"oklch(0.7 0.15 25)\" : \"oklch(0.78 0.16 150)\",\n      summaryLine: doneCount + \" project\" + (doneCount === 1 ? \"\" : \"s\") + \" complete · \" + activeWeek + \" of 8 committed in the last seven days · \" + fullDocs + \" docs folders complete\",\n      streamCount: stream.length ? stream.length + \" commits\" : (src === \"loading\" ? \"loading…\" : \"none\"),\n      togetherStats: [\n        { label: \"Projects complete\", value: doneCount + \" / 8\", pct: pct(doneCount), color: \"oklch(0.72 0.16 150)\" },\n        { label: \"Committed in the last 7 days\", value: activeWeek + \" / 8\", pct: pct(activeWeek), color: \"oklch(0.8 0.13 200)\" },\n        { label: \"Project repos registered\", value: withRepo + \" / 8\", pct: pct(withRepo), color: \"oklch(0.82 0.12 255)\" },\n        { label: \"Docs folders complete\", value: fullDocs + \" / 8\", pct: pct(fullDocs), color: \"oklch(0.84 0.12 85)\" }\n      ],\n      sourceNote: {\n        loading: \"Reading the hub's activity.json…\",\n        activity: \"Live from the hub's activity.json\" + (this.state.generatedAt ? \", generated \" + this.state.generatedAt : \"\") + \". \"\n          + (people.some(p => p.docsLive) ? \"Docs completeness is live from the build.\" : \"Docs completeness is a snapshot — run the patched build_hub.py to make it live.\"),\n        api: \"activity.json was unreachable, so commits came straight from the GitHub API. Members and docs come from team.yaml.\",\n        offline: \"Commit activity unavailable — showing the team.yaml registry only.\"\n      }[src]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fdiv><\u002Fx-dc><\u002Fbody><\u002Fhtml>"
  </script>
